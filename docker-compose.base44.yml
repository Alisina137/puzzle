services:
  postgres:
    image: postgres:15-alpine
    container_name: puzzlebook_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: puzzlebook_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: puzzlebook_redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  setup:
    build:
      context: .
      dockerfile: Dockerfile.base44
    container_name: puzzlebook_setup
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/puzzlebook_dev
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npm install --no-audit --no-fund && npx prisma generate && npx prisma db push --accept-data-loss && npx prisma db seed"

  web:
    build:
      context: .
      dockerfile: Dockerfile.base44
    container_name: puzzlebook_web
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/puzzlebook_dev
      - REDIS_URL=redis://redis:6379
      - NEXTAUTH_URL=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      - NEXT_PUBLIC_APP_URL=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    command: sh -c "npx next dev -p 3000 -H 0.0.0.0"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.base44
    container_name: puzzlebook_worker
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/puzzlebook_dev
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
    command: sh -c "npx tsx src/workers/generation.worker.ts"
    restart: unless-stopped

volumes:
  postgres_data:
  node_modules:
